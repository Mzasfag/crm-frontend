<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BrandOS - Campaign Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-high": "#e2e8f8",
                      "on-secondary-fixed": "#191c1d",
                      "error-container": "#ffdad6",
                      "on-surface-variant": "#50434c",
                      "surface": "#f9f9ff",
                      "on-tertiary": "#ffffff",
                      "background": "#f9f9ff",
                      "on-tertiary-container": "#8487ff",
                      "on-tertiary-fixed": "#07006c",
                      "secondary": "#5c5f60",
                      "primary-fixed": "#ffd7f3",
                      "surface-variant": "#dce2f3",
                      "error": "#ba1a1a",
                      "tertiary-fixed-dim": "#c0c1ff",
                      "surface-dim": "#d3daea",
                      "tertiary": "#050062",
                      "tertiary-fixed": "#e1e0ff",
                      "primary": "#330030",
                      "on-surface": "#151c27",
                      "surface-tint": "#8d4283",
                      "secondary-fixed-dim": "#c5c7c8",
                      "on-error-container": "#93000a",
                      "inverse-surface": "#2a313d",
                      "primary-container": "#520b4d",
                      "on-primary-fixed": "#390036",
                      "surface-container-highest": "#dce2f3",
                      "secondary-fixed": "#e1e3e4",
                      "on-secondary": "#ffffff",
                      "outline-variant": "#d4c1cd",
                      "on-tertiary-fixed-variant": "#2f2ebe",
                      "secondary-container": "#e1e3e4",
                      "on-error": "#ffffff",
                      "surface-bright": "#f9f9ff",
                      "on-primary": "#ffffff",
                      "inverse-primary": "#ffabee",
                      "on-primary-fixed-variant": "#722a69",
                      "surface-container-lowest": "#ffffff",
                      "inverse-on-surface": "#ebf1ff",
                      "surface-container-low": "#f0f3ff",
                      "on-secondary-fixed-variant": "#454748",
                      "surface-container": "#e7eefe",
                      "on-background": "#151c27",
                      "primary-fixed-dim": "#ffabee",
                      "on-secondary-container": "#626566",
                      "on-primary-container": "#ca77bc",
                      "outline": "#82737d",
                      "tertiary-container": "#0e009e"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-sm": "8px",
                      "container-padding-mobile": "16px",
                      "stack-md": "16px",
                      "stack-lg": "24px",
                      "container-padding-desktop": "32px",
                      "gutter": "24px",
                      "base": "4px"
              },
              "fontFamily": {
                      "label-md": [
                              "Geist"
                      ],
                      "body-md": [
                              "Inter"
                      ],
                      "headline-lg-mobile": [
                              "Geist"
                      ],
                      "headline-lg": [
                              "Geist"
                      ],
                      "body-lg": [
                              "Inter"
                      ],
                      "title-md": [
                              "Geist"
                      ],
                      "display-lg": [
                              "Geist"
                      ]
              },
              "fontSize": {
                      "label-md": [
                              "12px",
                              {
                                      "lineHeight": "1",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "500"
                              }
                      ],
                      "body-md": [
                              "14px",
                              {
                                      "lineHeight": "1.5",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-lg-mobile": [
                              "24px",
                              {
                                      "lineHeight": "1.2",
                                      "fontWeight": "600"
                              }
                      ],
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "1.2",
                                      "letterSpacing": "-0.01em",
                                      "fontWeight": "600"
                              }
                      ],
                      "body-lg": [
                              "16px",
                              {
                                      "lineHeight": "1.6",
                                      "fontWeight": "400"
                              }
                      ],
                      "title-md": [
                              "20px",
                              {
                                      "lineHeight": "1.4",
                                      "fontWeight": "600"
                              }
                      ],
                      "display-lg": [
                              "48px",
                              {
                                      "lineHeight": "1.1",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ]
              }
            }
          }
        }
    </script>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-container-padding-mobile md:p-container-padding-desktop">
<!-- Modal Backdrop Overlay -->
<div aria-hidden="true" class="fixed inset-0 bg-on-background/40 backdrop-blur-sm z-40 transition-opacity"></div>
<!-- Modal Container -->
<div aria-labelledby="modal-title" aria-modal="true" class="relative bg-surface-container-lowest rounded-xl shadow-[0_1px_3px_0_rgba(0,0,0,0.05),_0_1px_2px_0_rgba(0,0,0,0.03)] border border-secondary-container w-full max-w-2xl z-50 flex flex-col max-h-[90vh]" role="dialog">
<!-- Modal Header -->
<div class="flex items-center justify-between p-stack-lg border-b border-secondary-container">
<div>
<h2 class="font-title-md text-title-md text-on-surface" id="modal-title">Create New Campaign</h2>
<p class="font-body-md text-body-md text-secondary mt-1">Define the parameters for your next marketing initiative.</p>
</div>
<button aria-label="Close modal" class="text-secondary hover:text-on-surface transition-colors p-2 rounded-full hover:bg-surface-container-high focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="button">
<span aria-hidden="true" class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Modal Body (Scrollable) -->
<div class="p-stack-lg overflow-y-auto flex-1">
<form class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Campaign Name -->
<div class="md:col-span-2 space-y-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant block" for="campaignName">CAMPAIGN NAME</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">campaign</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 bg-surface-bright border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-secondary-fixed-dim focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-shadow" id="campaignName" name="campaignName" placeholder="e.g. Q3 Summer Sale" type="text"/>
</div>
</div>
<!-- Channel -->
<div class="space-y-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant block" for="channel">CHANNEL</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">share</span>
</div>
<select class="block w-full pl-10 pr-10 py-2 bg-surface-bright border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-shadow appearance-none" id="channel" name="channel">
<option disabled="" selected="" value="">Select a channel</option>
<option value="paid_ads">Paid Ads</option>
<option value="social_media">Social Media</option>
<option value="email_marketing">Email Marketing</option>
<option value="seo">SEO</option>
</select>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">expand_more</span>
</div>
</div>
</div>
<!-- Status -->
<div class="space-y-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant block" for="status">STATUS</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">info</span>
</div>
<select class="block w-full pl-10 pr-10 py-2 bg-surface-bright border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-shadow appearance-none" id="status" name="status">
<option selected="" value="draft">Draft</option>
<option value="active">Active</option>
<option value="paused">Paused</option>
<option value="completed">Completed</option>
</select>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">expand_more</span>
</div>
</div>
</div>
<!-- Budget -->
<div class="space-y-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant block" for="budget">BUDGET</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">payments</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 bg-surface-bright border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-secondary-fixed-dim focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-shadow" id="budget" min="0" name="budget" placeholder="0.00" step="100" type="number"/>
</div>
</div>
<!-- Date Range -->
<div class="space-y-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant block" for="dateRange">DATE RANGE</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">calendar_month</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 bg-surface-bright border border-error rounded-lg font-body-md text-body-md text-on-surface placeholder:text-secondary-fixed-dim focus:ring-2 focus:ring-error focus:border-error focus:outline-none transition-shadow" id="dateRange" name="dateRange" placeholder="Select dates" type="text"/>
</div>
<p class="font-body-md text-[12px] text-error mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">error</span>
                        Date range is required for Active campaigns.
                    </p>
</div>
<!-- Target Audience (Textarea) -->
<div class="md:col-span-2 space-y-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant block" for="audience">TARGET AUDIENCE NOTES</label>
<div class="relative">
<div class="absolute top-3 left-3 flex items-start pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">group</span>
</div>
<textarea class="block w-full pl-10 pr-3 py-2 bg-surface-bright border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-secondary-fixed-dim focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-shadow resize-none" id="audience" name="audience" placeholder="Describe the ideal customer segment..." rows="3"></textarea>
</div>
</div>
</form>
</div>
<!-- Modal Footer -->
<div class="flex items-center justify-end gap-stack-md p-stack-lg border-t border-secondary-container bg-surface/50 rounded-b-xl">
<button class="font-label-md text-label-md text-on-surface bg-surface-container-high hover:bg-surface-variant px-6 py-2.5 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="button">
                Cancel
            </button>
<button class="font-label-md text-label-md text-on-primary bg-primary-container hover:bg-primary px-6 py-2.5 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 flex items-center gap-2" type="button">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">save</span>
                Save Campaign
            </button>
</div>
</div>
</body></html>
