<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>BrandOS - Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />

      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">

        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'surface-container': '#e7eefe',
              'on-secondary': '#ffffff',

              'on-tertiary-fixed-variant': '#2f2ebe',

              'surface-dim': '#d3daea',
              'surface-container-lowest': '#ffffff',
              'surface-bright': '#f9f9ff',
              'primary-fixed-dim': '#ffabee',
              'outline-variant': '#d4c1cd',
              'tertiary-fixed-dim': '#c0c1ff',
              'on-secondary-fixed': '#191c1d',
              'on-primary-fixed': '#390036',
              'primary-fixed': '#ffd7f3',
              tertiary: '#050062',
              'on-tertiary-fixed': '#07006c',
              'on-surface-variant': '#50434c',
              'on-error': '#ffffff',
              'on-primary-container': '#ca77bc',
              'error-container': '#ffdad6',
              'tertiary-container': '#0e009e',
              'surface-container-low': '#f0f3ff',
              'on-surface': '#151c27',
              'on-background': '#151c27',
              surface: '#f9f9ff',
              'secondary-fixed-dim': '#c5c7c8',
              secondary: '#5c5f60',
              'on-tertiary-container': '#8487ff',
              'surface-container-high': '#e2e8f8',
              'on-secondary-container': '#626566',
              'on-primary': '#ffffff',
              'on-tertiary': '#ffffff',
              outline: '#82737d',
              'inverse-on-surface': '#ebf1ff',
              'on-secondary-fixed-variant': '#454748',
              'inverse-surface': '#2a313d',
              'tertiary-fixed': '#e1e0ff',
              'on-primary-fixed-variant': '#722a69',
              'surface-tint': '#8d4283',
              'primary-container': '#520b4d',

            borderRadius: {

                { lineHeight: '1.1', letterSpacing: '-0.02em', fontWeight: '700' },
              ],
              'title-md': ['20px', { lineHeight: '1.4', fontWeight: '600' }],

              'label-md': ['12px', { lineHeight: '1', letterSpacing: '0.05em', fontWeight: '500' }],

          },
        },

    <style>
      .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
      }

      .gradient-bg {
        background: linear-gradient(135deg, #f9f9ff 0%, #e7eefe 100%);
        position: relative;
        overflow: hidden;
      }

      .gradient-blob {
        position: absolute;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(82, 11, 77, 0.15) 0%, rgba(255, 255, 255, 0) 70%);
        border-radius: 50%;
        z-index: 0;
      }

      .blob-1 {
        top: -200px;
        left: -100px;
      }
      .blob-2 {
        bottom: -150px;
        right: -200px;
        background: radial-gradient(circle, rgba(5, 0, 98, 0.1) 0%, rgba(255, 255, 255, 0) 70%);
      }
    </style>
  </head>
  <body
    class="bg-background text-on-background min-h-screen font-body-md gradient-bg flex items-center justify-center p-container-padding-mobile md:p-container-padding-desktop"
  >
    <div class="gradient-blob blob-1"></div>
    <div class="gradient-blob blob-2"></div>
    <main
      class="w-full max-w-5xl relative z-10 grid grid-cols-1 md:grid-cols-2 gap-0 bg-surface-container-lowest rounded-xl overflow-hidden shadow-[0_8px_30px_rgb(0,0,0,0.08)] border border-secondary-container"
    >
      <!-- Left Panel: Form -->
      <div class="p-8 md:p-12 flex flex-col justify-center">
        <div class="mb-8">
          <h1 class="font-display-lg text-display-lg text-primary-container mb-2">BrandOS</h1>
          <p class="font-body-lg text-body-lg text-secondary">
            Sign in to your Agency CRM workspace.
          </p>
        </div>
        <form class="space-y-6">
          <div>
            <label
              class="block font-label-md text-label-md text-on-surface-variant mb-2"
              for="email"
              >Email Address</label
            >
            <input
              class="w-full px-4 py-3 bg-surface-bright border border-secondary-container rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all font-body-md text-on-surface"
              id="email"
              name="email"
              placeholder="name@agency.com"
              required=""
              type="email"
            />
          </div>
          <div>
            <div class="flex items-center justify-between mb-2">
              <label
                class="block font-label-md text-label-md text-on-surface-variant"
                for="password"
                >Password</label
              >
              <a
                class="font-label-md text-label-md text-primary-container hover:text-surface-tint transition-colors"
                href="#"
                >Forgot Password?</a
              >
            </div>
            <input
              class="w-full px-4 py-3 bg-surface-bright border border-secondary-container rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all font-body-md text-on-surface"
              id="password"
              name="password"
              placeholder="••••••••"
              required=""
              type="password"
            />
          </div>
          <div class="flex items-center">
            <input
              class="w-4 h-4 text-primary-container border-secondary-container rounded focus:ring-primary-container bg-surface-bright"
              id="remember"
              name="remember"
              type="checkbox"
            />
            <label class="ml-2 font-body-md text-body-md text-secondary" for="remember"
              >Remember me for 30 days</label
            >
          </div>
          <button
            class="w-full py-3 px-6 bg-primary-container text-on-primary rounded-lg font-title-md text-title-md hover:bg-surface-tint transition-colors duration-200 shadow-sm flex items-center justify-center gap-2"
            type="submit"
          >
            Sign In
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0"
              >arrow_forward</span
            >
          </button>
        </form>
        <div class="mt-8 pt-6 border-t border-secondary-container text-center">
          <p class="font-body-md text-body-md text-secondary">
            Don't have an account?
            <a class="text-primary-container font-semibold hover:underline" href="#"
              >Contact Sales</a
            >
          </p>
        </div>
      </div>
      <!-- Right Panel: Visual -->
      <div class="hidden md:block relative bg-surface-container-high overflow-hidden">
        <div class="absolute inset-0 bg-primary-container opacity-[0.03]"></div>
        <div
          class="absolute inset-0 p-12 flex flex-col justify-end z-10 bg-gradient-to-t from-surface-container-highest/80 to-transparent"
        >
          <div class="glass-card p-6 rounded-xl border border-white/40">
            <div class="flex items-start gap-4">
              <span
                class="material-symbols-outlined text-primary-container text-4xl"
                style="font-variation-settings: 'FILL' 1"
                >insights</span
              >
              <div>
                <h3 class="font-title-md text-title-md text-on-surface mb-1">
                  Accelerate Agency Growth
                </h3>
                <p class="font-body-md text-body-md text-on-surface-variant">
                  Manage clients, campaigns, and team tasks in one unified, high-performance
                  workspace.
                </p>
              </div>
            </div>
          </div>
        </div>
        <img
          class="w-full h-full object-cover object-center absolute inset-0 z-0 opacity-80 mix-blend-multiply"
          data-alt="A sophisticated, high-end 3D abstract illustration featuring sleek geometric shapes in deep plum (#520B4D) and bright white, symbolizing organized data and multi-tenant CRM architecture. The scene is illuminated by soft, professional studio lighting with a clean, light-mode background, evoking a modern corporate and minimalist aesthetic."
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuAkgaJMATYoDgnot9kcHVSgyUbLpxxvLYNOd2JOzMixhnDjU468O-QlU_Nz3NWv751ejzWThItkeJPn_gul6PtVISfoz-fxszC89CpgZuyOQZ_imylK1upkYO9IJ7mvqrwHhBvhm2ZzDd2zJfzv2zAIzqBElwF1WvUynJKCwnb2AtYYbBztY3AbIiDRMsJf5p111dnVkhwXkesr2Sq4rGQCoIC4-3f6z1p8dOFLxF_bnvdOLnezDhaDmRyM3jKU5P2kSTfM1-lzmcY"
        />
      </div>
    </main>
  </body>
</html>
