<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BrandOS - Register Company</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Geist:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/lucide@latest"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#e7eefe",
                        "on-secondary": "#ffffff",
                        "surface-variant": "#dce2f3",
                        "on-tertiary-fixed-variant": "#2f2ebe",
                        "on-error-container": "#93000a",
                        "secondary-container": "#e1e3e4",
                        "surface-dim": "#d3daea",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#f9f9ff",
                        "primary-fixed-dim": "#ffabee",
                        "outline-variant": "#d4c1cd",
                        "tertiary-fixed-dim": "#c0c1ff",
                        "on-secondary-fixed": "#191c1d",
                        "on-primary-fixed": "#390036",
                        "primary-fixed": "#ffd7f3",
                        "tertiary": "#050062",
                        "on-tertiary-fixed": "#07006c",
                        "on-surface-variant": "#50434c",
                        "on-error": "#ffffff",
                        "on-primary-container": "#ca77bc",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#0e009e",
                        "surface-container-low": "#f0f3ff",
                        "on-surface": "#151c27",
                        "on-background": "#151c27",
                        "surface": "#f9f9ff",
                        "secondary-fixed-dim": "#c5c7c8",
                        "secondary": "#5c5f60",
                        "on-tertiary-container": "#8487ff",
                        "surface-container-high": "#e2e8f8",
                        "on-secondary-container": "#626566",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "outline": "#82737d",
                        "inverse-on-surface": "#ebf1ff",
                        "on-secondary-fixed-variant": "#454748",
                        "inverse-surface": "#2a313d",
                        "tertiary-fixed": "#e1e0ff",
                        "on-primary-fixed-variant": "#722a69",
                        "surface-tint": "#8d4283",
                        "primary-container": "#520b4d",
                        "background": "#f9f9ff",
                        "secondary-fixed": "#e1e3e4",
                        "inverse-primary": "#ffabee",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#dce2f3",
                        "primary": "#330030"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "base": "4px",
                        "gutter": "24px",
                        "stack-lg": "24px",
                        "stack-md": "16px",
                        "container-padding-mobile": "16px",
                        "container-padding-desktop": "32px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg": ["Geist"],
                        "title-md": ["Geist"],
                        "headline-lg-mobile": ["Geist"],
                        "headline-lg": ["Geist"],
                        "label-md": ["Geist"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "title-md": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "500" }]
                    },
                    "boxShadow": {
                        'soft': '0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03)',
                        'xl': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #F9FAFB; /* Level 0 Background */
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-background text-on-background antialiased font-body-md">
<!-- Main Container -->
<div class="w-full max-w-md">
<!-- Branding Area -->
<div class="flex flex-col items-center mb-stack-lg">
<div class="font-display-lg text-display-lg font-bold text-primary mb-2">BrandOS</div>
<p class="font-body-md text-body-md text-secondary text-center">Set up your agency workspace to manage clients, deals, and campaigns effectively.</p>
</div>
<!-- Registration Card -->
<div class="bg-surface-container-lowest border border-secondary-container rounded-2xl shadow-xl overflow-hidden">
<div class="p-container-padding-desktop">
<h2 class="font-title-md text-title-md text-on-surface mb-stack-lg">Register Company</h2>
<form action="#" class="space-y-stack-md" method="POST">
<!-- Company Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-stack-sm uppercase" for="company_name">Company Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<i class="h-5 w-5 text-secondary" data-lucide="building-2"></i>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-secondary-container rounded-lg focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm bg-surface-bright" id="company_name" name="company_name" placeholder="e.g. Acme Corp" type="text" value="Blue Ocean Agency"/>
</div>
</div>
<!-- Industry -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-stack-sm uppercase" for="industry">Industry</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<i class="h-5 w-5 text-secondary" data-lucide="briefcase"></i>
</div>
<select class="block w-full pl-10 pr-3 py-2 border border-secondary-container rounded-lg focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm bg-surface-bright appearance-none" id="industry" name="industry">
<option selected="" value="marketing">Marketing &amp; Advertising</option>
<option value="technology">Technology &amp; Software</option>
<option value="consulting">Consulting Services</option>
<option value="other">Other</option>
</select>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<i class="h-4 w-4 text-secondary" data-lucide="chevron-down"></i>
</div>
</div>
</div>
<div class="border-t border-secondary-container my-stack-md pt-stack-sm">
<span class="block font-label-md text-label-md text-secondary uppercase tracking-wider mb-stack-sm">Admin Details</span>
</div>
<!-- Admin Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-stack-sm uppercase" for="admin_name">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<i class="h-5 w-5 text-secondary" data-lucide="user"></i>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-secondary-container rounded-lg focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm bg-surface-bright" id="admin_name" name="admin_name" placeholder="John Doe" type="text" value="John Smith"/>
</div>
</div>
<!-- Admin Email -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-stack-sm uppercase" for="email">Work Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<i class="h-5 w-5 text-secondary" data-lucide="mail"></i>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-secondary-container rounded-lg focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm bg-surface-bright" id="email" name="email" placeholder="you@company.com" type="email" value="admin@blueocean.com"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-stack-sm uppercase" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<i class="h-5 w-5 text-secondary" data-lucide="lock"></i>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-secondary-container rounded-lg focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm bg-surface-bright" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-stack-sm">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-soft text-body-md font-body-md font-semibold text-on-primary bg-primary-container hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-colors duration-200" type="submit">
                            Create Workspace
                        </button>
</div>
</form>
</div>
<!-- Card Footer -->
<div class="bg-surface py-4 px-container-padding-desktop border-t border-secondary-container">
<p class="text-center font-body-md text-body-md text-secondary">
                    Already have an account? <a class="font-semibold text-primary-container hover:text-surface-tint transition-colors" href="#">Login</a>
</p>
</div>
</div>
</div>
<!-- Initialize Lucide Icons -->
<script>
        lucide.createIcons();
    </script>
</body></html>
